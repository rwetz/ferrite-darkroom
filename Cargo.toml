[package]
name = "ferrite-darkroom"
version = "0.1.1"
description = "A Ferrite dither studio: turn a photo into pixel art or ASCII with twenty dither algorithms and retro palettes, and export PNG or text."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-darkroom"
readme = "README.md"
keywords = ["gpui", "ferrite", "dither", "ascii-art", "pixel-art"]
categories = ["gui", "multimedia::images"]
edition = "2024"
rust-version = "1.88"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "0b13d8087942fd4dc65c2a62ef19bdf60f7547e7" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
