[package]
name = "ferrite-darkroom"
version = "1.0.0"
description = "A Ferrite dither and text-art studio: photos, GIFs and video into pixel art, braille or ASCII, in twenty-nine algorithms and any palette."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-darkroom"
readme = "README.md"
keywords = ["gpui", "ferrite", "dither", "ascii-art", "pixel-art"]
categories = ["gui", "multimedia::images"]
edition = "2024"
rust-version = "1.88"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "ebf7ee99f6265fc81875f0c798aba8a4e306e160" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Exact-palette GIF and APNG encoding (image's own GIF encoder requantises).
gif = "0.14"
png = "0.18"

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
