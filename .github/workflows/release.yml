name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        # An unreachable package mirror once hung this step for hours: give up
        # on a slow mirror quickly, retry, and never wait more than 10 minutes.
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain || true
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="ferrite-darkroom-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/licenses"
          bin="target/${{ matrix.target }}/release/ferrite-darkroom"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE NOTICE CHANGELOG.md "$name/"
          cp -r recipes "$name/"
          # The font licenses ship with ferrite-design's source in cargo's git checkout.
          fonts=$(find ~/.cargo/git/checkouts -path '*ferrite-design*/assets/fonts' -type d | head -1)
          cp "$fonts"/LICENSE-* "$name/licenses/"
          # And the fonts Darkroom bundles for text art.
          cp assets/fonts/LICENSE-* assets/fonts/OFL-* "$name/licenses/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ferrite-darkroom-*.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ferrite-darkroom-* > SHA256SUMS.txt
      - name: Notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Darkroom $GITHUB_REF_NAME" --notes-file notes.md
