name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release
  queue: max
  cancel-in-progress: false
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release version rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Prepare versioned release
        id: release
        run: python3 .github/scripts/prepare_release.py

  build:
    needs: prepare
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        # An unreachable package mirror once hung this step for hours: give up
        # on a slow mirror quickly, retry, and never wait more than 10 minutes.
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain || true
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="ferrite-darkroom-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$name/licenses"
          bin="target/${{ matrix.target }}/release/ferrite-darkroom"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE NOTICE CHANGELOG.md "$name/"
          cp -r recipes "$name/"
          # The font licenses ship with ferrite-design's source in cargo's git checkout.
          fonts=$(find ~/.cargo/git/checkouts -path '*ferrite-design*/assets/fonts' -type d | head -1)
          cp "$fonts"/LICENSE-* "$name/licenses/"
          # And the fonts Darkroom bundles for text art.
          cp assets/fonts/LICENSE-* assets/fonts/OFL-* "$name/licenses/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ferrite-darkroom-*.${{ matrix.archive }}

  release:
    needs: [prepare, build]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ferrite-darkroom-* > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Darkroom $RELEASE_TAG" --generate-notes
          fi
